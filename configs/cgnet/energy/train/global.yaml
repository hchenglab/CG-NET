defaults:
- cluster: global
- backbone: K4L2
- dataset: global
- tasks: ade
- _self_
job:
  device_type: ${cluster.device}
  scheduler:
    mode: ${cluster.mode}
    ranks_per_node: ${cluster.ranks_per_node}
    num_nodes: ${cluster.num_nodes}
    slurm:
      partition: ${cluster.partition}
      mem_gb: ${cluster.mem_gb}
      cpus_per_task: ${cluster.cpus_per_task}
  debug: ${cluster.debug}
  run_name: ${cluster.data_name}_global
  run_dir: ${cluster.base_dir}/${cluster.data_name}/train/runs/global
  logger:
    _target_: fairchem.core.common.logger.WandBSingletonLogger.init_wandb
    _partial_: true
    entity: localgraph
    project: ade

seed: 0
moe_layer_type: pytorch
train_sample: null
val_sample: null
num_moe_experts: 2
max_neighbors: 30
cutoff_radius: 6.0
cluster_radius: null
pseudo_radius: null
cluster_with_pseudonodes: false
epochs: 100
steps: null
batch_size: 64
bf16: true
cpu_graph: false
otf_graph: true
normalizer_rmsd: 1.0
ade_coef: 1
regress_stress: false
direct_forces: true
regress_forces: false
dataset_list:
- data
exclude_keys:
- id
- fid
- absolute_idx
- target_pos
- ref_energy
- pbc
- nads
- oc22
- formation_energy
- total_charge
train_dataset:
  _target_: fairchem.core.datasets.mt_concat_dataset.create_concat_dataset
  dataset_configs:
    data: ${dataset.train}
  combined_dataset_config:
    sampling:
      type: explicit
      ratios:
        data.train: 1.0
val_dataset:
  _target_: fairchem.core.datasets.mt_concat_dataset.create_concat_dataset
  dataset_configs:
    data: ${dataset.val}
  combined_dataset_config:
    sampling:
      type: temperature
      temperature: 1.0
train_dataloader:
  _target_: fairchem.core.components.common.dataloader_builder.get_dataloader
  dataset: ${train_dataset}
  batch_sampler_fn:
    _target_: fairchem.core.common.data_parallel.BalancedBatchSampler
    _partial_: true
    batch_size: ${batch_size}
    shuffle: true
    seed: ${seed}
  num_workers: ${cluster.dataloader_workers}
  persistent_workers: True 
  collate_fn:
    _target_: fairchem.core.units.mlip_unit.mlip_unit.mt_collater_adapter
    tasks: ${tasks}
    exclude_keys: ${exclude_keys}
eval_dataloader:
  _target_: fairchem.core.components.common.dataloader_builder.get_dataloader
  dataset: ${val_dataset}
  batch_sampler_fn:
    _target_: fairchem.core.common.data_parallel.BalancedBatchSampler
    _partial_: true
    batch_size: ${batch_size}
    shuffle: false
    seed: ${seed}
  num_workers: ${cluster.dataloader_workers}
  persistent_workers: True 
  collate_fn:
    _target_: fairchem.core.units.mlip_unit.mlip_unit.mt_collater_adapter
    tasks: ${tasks}
    exclude_keys: ${exclude_keys}
heads:
  ade:
    module: fairchem.core.models.uma.escn_md.Linear_System_Scalar_Head
    output_property: ade
    reduce: sum
runner:
  _target_: fairchem.core.components.train.train_runner.TrainEvalRunner
  train_dataloader: ${train_dataloader}
  eval_dataloader: ${eval_dataloader}
  train_eval_unit:
    _target_: fairchem.core.units.mlip_unit.mlip_unit.MLIPTrainEvalUnit
    job_config: ${job}
    tasks: ${tasks}
    model:
      _target_: fairchem.core.models.base.HydraModel
      backbone: ${backbone}
      heads: ${heads}
    optimizer_fn:
      _target_: torch.optim.AdamW
      _partial_: true
      lr: 8e-4
      weight_decay: 1e-3
    cosine_lr_scheduler_fn:
      _target_: fairchem.core.units.mlip_unit.mlip_unit._get_consine_lr_scheduler
      _partial_: true
      warmup_factor: 0.2
      warmup_epochs: 0.05
      lr_min_factor: 0.01
      epochs: ${epochs}
      steps: ${steps}
    print_every: 50
    clip_grad_norm: 100
    bf16: ${bf16}
  max_epochs: ${epochs}
  max_steps: ${steps}
  evaluate_every_n_steps: null
  callbacks:
    - _target_: fairchem.core.components.train.train_runner.EarlyStopAndBestCheckpoint
      monitor: "val/data.val,ade,mae"  # metric to monitor
      mode: "min"
      patience: 5                     # patience for early stop
      min_delta: 1e-4                 # minimum meaningful improvement threshold
      grace_period: 50                # grace period (no early stopping for the first few epochs)
      save_dir: ${job.metadata.checkpoint_dir}
