test:
  splits:
    test:
      sample_n: ${test_sample}
      src:
        - ${cluster.data_dir}/test
  format: ase_db
  a2g_args:
    r_energy: True
    r_forces: ${regress_forces}
    r_stress: ${regress_stress}
    r_edges: ${cpu_graph}
    radius: ${cutoff_radius}
    max_neigh: ${max_neighbors}
    cluster_radius: ${cluster_radius}
    pseudo_radius: ${pseudo_radius}
    cluster_with_pseudonodes: ${cluster_with_pseudonodes}
    r_custom_info_keys: ["adsorption_energy"]
  key_mapping:
    adsorption_energy: ade
  transforms:
    common_transform:
      dataset_name: data
