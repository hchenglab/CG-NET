oc20_train:
  splits:
    train:
      sample_n: ${train_sample}
      src:
        - ${cluster.data_dir}/train
  format: ase_db
  a2g_args:
    r_energy: True
    r_forces: False
    r_edges: ${cpu_graph}
    radius: ${cutoff_radius}
    max_neigh: ${max_neighbors}
    r_custom_info_keys: ["adsorption_energy", "atom_weight", "cluster_partition"]
  key_mapping:
    adsorption_energy: ${cluster.data_name}_adsorption_energy
  transforms:
    common_transform:
      dataset_name: ${cluster.data_name}

oc20_val:
  splits:
    val_id:
      sample_n: ${val_sample}
      src:
        - ${cluster.data_dir}/val
  format: ase_db
  a2g_args:
    r_energy: True
    r_forces: False
    r_edges: ${cpu_graph}
    radius: ${cutoff_radius}
    max_neigh: ${max_neighbors}
    r_custom_info_keys: ["adsorption_energy", "atom_weight", "cluster_partition"]
  key_mapping:
    adsorption_energy: ${cluster.data_name}_adsorption_energy
  transforms:
    common_transform:
      dataset_name: ${cluster.data_name}
