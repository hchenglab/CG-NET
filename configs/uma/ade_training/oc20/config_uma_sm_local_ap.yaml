defaults:
- cluster: ap
- backbone: K4L2
- dataset: dataset_local
- tasks: adsorption_energy
- _self_
job:
  device_type: ${cluster.device}
  scheduler:
    mode: ${cluster.mode}
  debug: ${cluster.debug}
  run_name: ${cluster.data_name}_uma_sm_local
  run_dir: ${cluster.base_dir}/${cluster.data_name}/runs/uma_sm_local
  logger:
    _target_: fairchem.core.common.logger.WandBSingletonLogger.init_wandb
    _partial_: true
    entity: localgraph
    project: fairchem-uma

moe_layer_type: pytorch
train_sample: null
val_sample: null
num_moe_experts: 1
max_neighbors: 30
cutoff_radius: 3.0
cluster_radius: 3.0
cluster_with_pseudonodes: true
epochs: 100
steps: null
max_atoms: 2000
bf16: false
cpu_graph: false
otf_graph: true
normalizer_rmsd: 1.0
adsorption_energy_coef: 1
regress_stress: false
direct_forces: true
dataset_list:
- ${cluster.data_name}
exclude_keys:
- id
- fid
- absolute_idx
- target_pos
- ref_energy
- pbc
- nads
- oc22
- formation_energy
- total_charge
train_dataset:
  _target_: fairchem.core.datasets.mt_concat_dataset.create_concat_dataset
  dataset_configs:
    oc20: ${dataset.oc20_train}
  combined_dataset_config:
    sampling:
      type: explicit
      ratios:
        oc20.train: 1.0
val_dataset:
  _target_: fairchem.core.datasets.mt_concat_dataset.create_concat_dataset
  dataset_configs:
    oc20: ${dataset.oc20_val}
  combined_dataset_config:
    sampling:
      type: temperature
      temperature: 1.0
train_dataloader:
  _target_: fairchem.core.components.common.dataloader_builder.get_dataloader
  dataset: ${train_dataset}
  batch_sampler_fn:
    _target_: fairchem.core.datasets.samplers.max_atom_distributed_sampler.MaxAtomDistributedBatchSampler
    _partial_: true
    max_atoms: ${max_atoms}
    shuffle: true
    seed: 0
  num_workers: ${cluster.dataloader_workers}
  collate_fn:
    _target_: fairchem.core.units.mlip_unit.mlip_unit.mt_collater_adapter
    tasks: ${tasks}
    exclude_keys: ${exclude_keys}
eval_dataloader:
  _target_: fairchem.core.components.common.dataloader_builder.get_dataloader
  dataset: ${val_dataset}
  batch_sampler_fn:
    _target_: fairchem.core.datasets.samplers.max_atom_distributed_sampler.MaxAtomDistributedBatchSampler
    _partial_: true
    max_atoms: ${max_atoms}
    shuffle: false
    seed: 0
  num_workers: ${cluster.dataloader_workers}
  collate_fn:
    _target_: fairchem.core.units.mlip_unit.mlip_unit.mt_collater_adapter
    tasks: ${tasks}
    exclude_keys: ${exclude_keys}
heads:
  oc20_adsorption_energy:
    module: fairchem.core.models.uma.escn_md.Linear_System_Scalar_Head
    output_property: adsorption_energy
    reduce: weighted_mean
runner:
  _target_: fairchem.core.components.train.train_runner.TrainEvalRunner
  train_dataloader: ${train_dataloader}
  eval_dataloader: ${eval_dataloader}
  train_eval_unit:
    _target_: fairchem.core.units.mlip_unit.mlip_unit.MLIPTrainEvalUnit
    job_config: ${job}
    tasks: ${tasks}
    model:
      _target_: fairchem.core.models.base.HydraModel
      backbone: ${backbone}
      heads: ${heads}
    optimizer_fn:
      _target_: torch.optim.AdamW
      _partial_: true
      lr: 8e-4
      weight_decay: 1e-3
    cosine_lr_scheduler_fn:
      _target_: fairchem.core.units.mlip_unit.mlip_unit._get_consine_lr_scheduler
      _partial_: true
      warmup_factor: 0.2
      warmup_epochs: 0.01
      lr_min_factor: 0.01
      epochs: ${epochs}
      steps: ${steps}
    print_every: 20
    clip_grad_norm: 100
    bf16: ${bf16}
  max_epochs: ${epochs}
  max_steps: ${steps}
  evaluate_every_n_steps: null
